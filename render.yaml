services:
  - type: web
    name: kinetiq
    runtime: docker
    # Free tier: no card needed. Sleeps after ~15 min idle, ~30-60s to wake.
    # Change to "starter" for always-on (paid).
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Add ONE provider key in the Render dashboard. sync:false means Render
      # prompts for the value and never stores it in this file or in git.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
