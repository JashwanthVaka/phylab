<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">KINETIQ kinetic K</title>
  <desc id="desc">A letter K formed by motion vectors, surrounded by an animated orbit and wave.</desc>
  <style>
    .orbit{transform-origin:64px 64px;animation:k-orbit 7.5s linear infinite}
    .orbit-back{transform-origin:64px 64px;animation:k-orbit-back 11s linear infinite}
    .trace{stroke-dasharray:30 160;animation:k-trace 3.4s linear infinite}
    .spark{animation:k-spark 2.4s ease-in-out infinite}
    @keyframes k-orbit{to{transform:rotate(360deg)}}
    @keyframes k-orbit-back{to{transform:rotate(-360deg)}}
    @keyframes k-trace{to{stroke-dashoffset:-190}}
    @keyframes k-spark{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.orbit,.orbit-back,.trace,.spark{animation:none}}
  </style>
  <rect x="3" y="3" width="122" height="122" rx="31" fill="#B9380E"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="29.5" fill="none" stroke="#FFD58A" stroke-opacity=".92" stroke-width="3"/>

  <g class="orbit-back" fill="none" stroke="#F4B942" stroke-opacity=".78" stroke-width="2.5">
    <ellipse cx="64" cy="64" rx="49" ry="23" transform="rotate(58 64 64)"/>
  </g>
  <g class="orbit" fill="none" stroke="#FFF8E8" stroke-width="3" stroke-linecap="round">
    <ellipse cx="64" cy="64" rx="50" ry="27" transform="rotate(-18 64 64)" stroke-dasharray="71 17 25 22"/>
    <circle cx="112" cy="50" r="5" fill="#F4B942" stroke="#FFF8E8" stroke-width="2"/>
  </g>

  <g class="letter" fill="none" stroke="#FFF8E8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M39 28v72"/>
    <path d="M88 29 40 64l48 35"/>
  </g>
  <g class="trace" fill="none" stroke="#F4B942" stroke-opacity=".92" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M39 28v72"/>
    <path d="M88 29 40 64l48 35"/>
  </g>
  <path d="m81 33 8-5-3 9" fill="#FFF8E8"/>
  <path d="m82 94 8 6-10 1" fill="#FFF8E8"/>

  <circle class="spark" cx="21" cy="31" r="3.5" fill="#F4B942"/>
</svg>
