<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>KINETIQ kinetic orbit mark</title>
  <style>
    .orbit{transform-origin:64px 64px;animation:kinetiq-orbit 9s linear infinite}
    .pulse{animation:kinetiq-pulse 2.4s ease-in-out infinite}
    @keyframes kinetiq-orbit{to{transform:rotate(360deg)}}
    @keyframes kinetiq-pulse{50%{opacity:.45;transform:scale(.84)}}
    @media (prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}
  </style>
  <rect x="3" y="3" width="122" height="122" rx="31" fill="#F4B942"/>
  <rect x="3.75" y="3.75" width="120.5" height="120.5" rx="30.25" fill="none" stroke="#FFF8E8" stroke-opacity=".72" stroke-width="1.5"/>
  <g class="orbit" fill="none" stroke="#9A3412" stroke-linecap="round">
    <ellipse cx="64" cy="64" rx="48" ry="29" stroke-width="3.5" stroke-dasharray="64 13 20 18"/>
    <circle cx="111" cy="61" r="5.5" fill="#9A3412" stroke="none"/>
    <circle cx="28" cy="43" r="3.5" fill="#FFF8E8" stroke="#9A3412" stroke-width="2"/>
  </g>
  <path d="M39 31v66M88 31 40 65l48 32M58 53 39 66l19 13" fill="none" stroke="#281B12" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="pulse" cx="64" cy="64" r="5" fill="#FFF8E8" stroke="#281B12" stroke-width="2"/>
</svg>
